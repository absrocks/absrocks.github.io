name: Update Google Scholar Citations

on:
  schedule:
    - cron: "0 0 * * 0" # weekly, Sunday 00:00 UTC
  workflow_dispatch:

# Needed so the job can push the updated data files back to the repo.
permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          echo "🔧 Installing dependencies..."
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run citation update script
        shell: bash
        run: |
          echo "🚀 Running citation update script..."
          start_time=$(date)
          set +e
          timeout 300 python bin/update_scholar_citations.py
          status=$?
          set -e
          end_time=$(date)
          if [ $status -eq 0 ]; then
            echo "✅ Citation update succeeded (started at $start_time, ended at $end_time)."
            echo "✅ Citation update succeeded." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Citation update script failed with exit code $status (started at $start_time, ended at $end_time)."
            echo "❌ Citation update script failed with exit code $status." >> $GITHUB_STEP_SUMMARY
            exit $status
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # The script writes all three of these; bib.liquid reads citations.yml,
          # publications.liquid reads scholar_profile.yml and citations_last5y.json.
          git add _data/citations.yml _data/scholar_profile.yml _data/citations_last5y.json
          if git diff --staged --quiet; then
            echo "ℹ️ Citation data unchanged; nothing to commit."
            echo "ℹ️ Citation data unchanged; nothing to commit." >> $GITHUB_STEP_SUMMARY
          else
            echo "📤 Committing and pushing changes..."
            git diff --staged --stat
            git commit -m "Update Google Scholar citations"
            git push
            echo "✅ Citation data updated and pushed. Site deploy will follow via the Deploy site workflow." >> $GITHUB_STEP_SUMMARY
          fi
